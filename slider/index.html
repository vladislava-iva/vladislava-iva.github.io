<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Галерея-слайдер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="gallery-container">
        <div class="gallery">
            <div class="gallery-item">
                <img src="cat1.jpg" alt="Изображение 1">
            </div>
            <div class="gallery-item">
                <img src="cat2.jpg" alt="Изображение 2">
            </div>
            <div class="gallery-item">
                <img src="cat3.jpg" alt="Изображение 3">
            </div>
            <div class="gallery-item">
                <img src="cat4.jpg" alt="Изображение 4">
            </div>
            <div class="gallery-item">
                <img src="cat5.jpg" alt="Изображение 5">
            </div>
            <div class="gallery-item">
                <img src="cat6.jpg" alt="Изображение 6">
            </div>
            <div class="gallery-item">
                <img src="cat7.jpg" alt="Изображение 7">
            </div>
            <div class="gallery-item">
                <img src="cat8.jpg" alt="Изображение 8">
            </div>
        </div>
        
        <button class="nav-btn prev">←</button>
        <button class="nav-btn next">→</button>
        
        <div class="pager">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
